# /etc/apache2/sites-available/isp-dashboard.conf
#
# AHNet ISP Dashboard — Apache VirtualHost on port 8879
# Steps:
#   1. sudo a2enmod rewrite headers
#   2. echo "Listen 8879" | sudo tee /etc/apache2/ports.conf  (atau append)
#   3. sudo cp docs/apache/isp-dashboard.conf /etc/apache2/sites-available/
#   4. sudo a2ensite isp-dashboard.conf
#   5. sudo systemctl reload apache2

<VirtualHost *:8879>
    ServerAdmin     admin@ahnet.local
    ServerName      isp.ahnet.local
    DocumentRoot    /var/www/isp-dashboard/public

    <Directory /var/www/isp-dashboard/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        DirectoryIndex index.php
    </Directory>

    # Pass-through real client IP from Cloudflare Tunnel / reverse proxy
    SetEnvIfNoCase X-Forwarded-Proto "https" HTTPS=on

    ErrorLog  ${APACHE_LOG_DIR}/isp-dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/isp-dashboard-access.log combined
</VirtualHost>
